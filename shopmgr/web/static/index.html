<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闲鱼多店铺管理</title>
  <link rel="icon" href="/static/brand/logo.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-home" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></symbol>
  <symbol id="i-truck" viewBox="0 0 24 24"><path d="M1 4h14v12H1z"/><path d="M15 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></symbol>
  <symbol id="i-github" viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></symbol>
</svg>

<div class="app">
  <aside class="side">
    <div class="logo"><img class="brand-logo" src="/static/brand/logo.png" alt="闲鱼"><span>店铺管理</span></div>
    <nav id="nav">
      <a href="#/dashboard" data-r="dashboard"><svg class="ic"><use href="#i-home"/></svg><span>概览</span></a>
      <a href="#/accounts" data-r="accounts"><svg class="ic"><use href="#i-users"/></svg><span>账号</span></a>
      <a href="#/items" data-r="items"><svg class="ic"><use href="#i-box"/></svg><span>商品</span></a>
      <a href="#/orders" data-r="orders"><svg class="ic"><use href="#i-truck"/></svg><span>订单</span><b class="badge" id="bWait"></b></a>
      <a href="#/im" data-r="im"><svg class="ic"><use href="#i-chat"/></svg><span>消息</span><b class="badge" id="bUnread"></b></a>
      <a href="#/refunds" data-r="refunds"><svg class="ic"><use href="#i-undo"/></svg><span>售后</span><b class="badge" id="bRefund"></b></a>
      <a href="#/rates" data-r="rates"><svg class="ic"><use href="#i-star"/></svg><span>评价</span></a>
      <a href="#/tasks" data-r="tasks"><svg class="ic"><use href="#i-list"/></svg><span>任务</span><b class="badge" id="bDead"></b></a>
      <a href="#/settings" data-r="settings"><svg class="ic"><use href="#i-sliders"/></svg><span>设置</span></a>
    </nav>
  </aside>
  <section class="main">
    <header class="topbar">
      <h1 id="pageTitle"></h1>
      <span class="spacer"></span>
      <span id="queueTag" class="chip hidden"></span>
      <a class="gh-link" href="https://github.com/likeyeee/XianYuTools" target="_blank" rel="noopener" title="GitHub 仓库：likeyeee/XianYuTools" aria-label="打开 GitHub 仓库"><svg class="ic"><use href="#i-github"/></svg></a>
      <label class="acc-pick"><img id="accAvatar" class="acc-avatar" alt="" referrerpolicy="no-referrer" hidden><i id="accDot" class="dot"></i><select id="accSel"></select></label>
    </header>
    <div class="content">
      <div id="banner"></div>
      <div id="view"></div>
    </div>
  </section>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-x" data-close aria-label="关闭"><svg class="ic"><use href="#i-x"/></svg></button><div id="modalBody"></div></div></div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
